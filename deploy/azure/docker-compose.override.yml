services:
  frontend:
    # Caddy no host fala com localhost:3000; não expomos o nginx diretamente.
    ports: !override
      - "127.0.0.1:3000:3000"

  backend:
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:4000/projetos').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\"",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  db:
    # VM de 1 GB: limita o MySQL e evita pressão desnecessária.
    command:
      - "--innodb-buffer-pool-size=128M"
      - "--performance-schema=OFF"
