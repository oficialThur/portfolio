version: '3.8'

services:
  frontend:
    build: .
    depends_on:
      - backend
    ports:
      - "5174:5173"
    volumes:
      - .:/app
      - /app/node_modules
    command: npm run dev -- --host

  backend:
    build:
      context: ./backend
    depends_on:
      - mailhog
    ports:
      - "8080:80"
    environment:
      SMTP_HOST: mailhog
      SMTP_PORT: 1025
      SMTP_AUTH: "false"
      SMTP_SECURE: none
      SMTP_FROM: noreply@portfolio.local
      SMTP_FROM_NAME: Portfolio Local
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
      RATE_LIMIT_ENABLED: "false"

  mailhog:
    image: mailhog/mailhog:v1.0.1
    ports:
      - "8025:8025"