services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: frontend-development
    container_name: portfolio-frontend-dev
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      NODE_ENV: development
      CHOKIDAR_USEPOLLING: "true"
      VITE_API_URL: http://backend:4000
    depends_on:
      - backend
    working_dir: /app
    command: npm run dev -- --host

  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: backend-development
    container_name: portfolio-backend-dev
    ports:
      - "4000:4000"
    volumes:
      - ./backend:/app
      - /app/node_modules
    environment:
      NODE_ENV: development
      PORT: "4000"
    working_dir: /app
