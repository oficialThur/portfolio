services:
  portfolio-dev:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: portfolio-dev
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    environment:
      - NODE_ENV=development
      - WATCHPACK_POLLING=true
    working_dir: /app
    command: npm run dev
